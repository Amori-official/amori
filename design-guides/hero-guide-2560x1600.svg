<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1600" viewBox="0 0 2560 1600">
  <g id="와이드-상하잘림">
    <rect x="0" y="0" width="2560" height="160" fill="#888780" fill-opacity="0.12"/>
    <rect x="0" y="1440" width="2560" height="160" fill="#888780" fill-opacity="0.12"/>
  </g>
  <g id="모바일-좌우잘림">
    <rect x="0" y="0" width="480" height="1600" fill="#E24B4A" fill-opacity="0.08"/>
    <rect x="2080" y="0" width="480" height="1600" fill="#E24B4A" fill-opacity="0.08"/>
  </g>
  <g id="상품-안전영역">
    <rect x="560" y="360" width="760" height="880" fill="#639922" fill-opacity="0.16" stroke="#3B6D11" stroke-width="4"/>
    <text x="940" y="790" font-family="AppleSDGothicNeo, sans-serif" font-size="70" fill="#173404" text-anchor="middle">상품 안전 영역</text>
    <text x="940" y="856" font-family="AppleSDGothicNeo, sans-serif" font-size="44" fill="#27500A" text-anchor="middle">여기에 상품 배치</text>
  </g>
  <g id="텍스트-영역">
    <rect x="1400" y="900" width="680" height="540" fill="#D85A30" fill-opacity="0.16" stroke="#993C1D" stroke-width="4"/>
    <text x="1740" y="1160" font-family="AppleSDGothicNeo, sans-serif" font-size="64" fill="#4A1B0C" text-anchor="middle">텍스트 영역</text>
    <text x="1740" y="1222" font-family="AppleSDGothicNeo, sans-serif" font-size="40" fill="#712B13" text-anchor="middle">비우고 밝게</text>
  </g>
  <g id="가이드선">
    <rect x="480" y="0" width="1600" height="1600" fill="none" stroke="#378ADD" stroke-width="5" stroke-dasharray="26 18"/>
    <line x1="1280" y1="0" x2="1280" y2="1600" stroke="#378ADD" stroke-width="2" stroke-dasharray="14 14" stroke-opacity="0.6"/>
    <line x1="0" y1="800" x2="2560" y2="800" stroke="#378ADD" stroke-width="2" stroke-dasharray="14 14" stroke-opacity="0.6"/>
  </g>
  <g id="라벨">
    <text x="40" y="70" font-family="AppleSDGothicNeo, sans-serif" font-size="44" fill="#444441">히어로 가이드 · 2560 × 1600 (16:10)</text>
    <text x="1280" y="230" font-family="AppleSDGothicNeo, sans-serif" font-size="40" fill="#185FA5" text-anchor="middle">모바일에서 보이는 범위 (1:1)</text>
    <text x="240" y="800" font-family="AppleSDGothicNeo, sans-serif" font-size="34" fill="#A32D2D" text-anchor="middle">모바일 잘림</text>
    <text x="2320" y="800" font-family="AppleSDGothicNeo, sans-serif" font-size="34" fill="#A32D2D" text-anchor="middle">모바일 잘림</text>
    <text x="1280" y="120" font-family="AppleSDGothicNeo, sans-serif" font-size="32" fill="#5F5E5A" text-anchor="middle">넓은 화면 상단 잘림</text>
    <text x="1280" y="1500" font-family="AppleSDGothicNeo, sans-serif" font-size="32" fill="#5F5E5A" text-anchor="middle">넓은 화면 하단 잘림</text>
  </g>
</svg>